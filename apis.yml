aid: better-life-partners
name: Better Life Partners
description: 'Better Life Partners is a Hanover, New Hampshire healthcare provider
  founded in 2018 that delivers same-day, whole-person treatment for opioid and alcohol
  use disorder across New Hampshire, Maine, Massachusetts, Vermont and North Carolina.
  It combines FDA-approved medication for addiction treatment (buprenorphine/Suboxone,
  naltrexone) with group counseling, peer recovery coaching and mental health care,
  delivered both virtually and in person, on a non-punitive harm-reduction model. The
  company contracts directly with Medicaid, Medicare and commercial health plans —
  MaineCare, NH Healthy Families, Anthem, Cigna, Harvard Pilgrim, Tufts, Humana and
  UnitedHealthcare — and markets value-based arrangements "from bundles to full risk"
  to payers and community partners. It is a clinical services organization rather than
  a software vendor: it references "purpose-built technology" internally but publishes
  no developer program, API, specification, SDK or integration documentation of any
  kind.'
