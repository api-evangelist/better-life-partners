x-evidence:
  fetched: '2026-08-07'
  note: 'No machine-readable contract of any kind was found. STEP 0b contract discovery
    was run against betterlifepartners.com and every plausible API/docs subdomain: api.,
    developer., developers., docs., app., portal., status. and trust..betterlifepartners.com
    do not resolve in DNS (curl exit 6). On the marketing host, /openapi.json, /openapi.yaml,
    /swagger.json, /v1/openapi.json, /api-docs, /docs, /redoc, /graphql, /api, /llms.txt
    and every /.well-known/ path (security.txt, openid-configuration, oauth-authorization-server,
    oauth-protected-resource, api-catalog, ai-plugin.json, agent-card.json, agent.json,
    mcp.json) each returned HTTP 404. The only machine-readable endpoint on the domain
    is the WordPress core /wp-json/ CMS route of the marketing site, which is the Yoast/WordPress
    content API of the brochureware — not a product API — and was deliberately not registered.
    Apparent "API" and "developer" strings on /partners/ and /refer-a-member/ are false
    positives from an embedded HubSpot forms script (js.hsforms.net/forms/embed/developer/)
    and a WordPress HubSpot plugin query parameter, not an API surface. Two GitHub organizations
    exist — github.com/better-life-partners (named "Better Life Partners", created 2019)
    and github.com/betterlifepartners (unnamed, created 2024) — both with 0 public repositories,
    so no GitHubOrganization pointer was emitted. No first-party package was found on
    npm or PyPI.'
